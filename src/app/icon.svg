<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Radiant background glow -->
    <radialGradient id="diyaGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE27B" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FF9D00" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#FF4500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer flame gradient -->
    <linearGradient id="flameOuter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="55%" stop-color="#FF9800"/>
      <stop offset="85%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <!-- Inner flame core -->
    <linearGradient id="flameCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFFDE7"/>
      <stop offset="80%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>

    <!-- Brass / Gold Diya Bowl -->
    <linearGradient id="brassBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="25%" stop-color="#E5BE4A"/>
      <stop offset="60%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#5B4002"/>
    </linearGradient>

    <!-- Rim Highlight -->
    <linearGradient id="brassRim" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="30%" stop-color="#FFFBE6"/>
      <stop offset="70%" stop-color="#F2D265"/>
      <stop offset="100%" stop-color="#8C6510"/>
    </linearGradient>

    <!-- Pedestal Base -->
    <linearGradient id="brassBase" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#593D06"/>
    </linearGradient>
  </defs>

  <!-- Aura Glow Behind Flame -->
  <circle cx="32" cy="27" r="26" fill="url(#diyaGlow)"/>

  <!-- Flame: Sacred Flickering Teardrop -->
  <!-- Outer golden-crimson flame -->
  <path d="M32 4 C34.5 13, 44 20, 42 31 C40.5 38.5, 36.5 42, 32 42 C27.5 42, 23.5 38.5, 22 31 C20 20, 29.5 13, 32 4 Z" fill="url(#flameOuter)"/>

  <!-- Inner radiant white-gold core -->
  <path d="M32 13 C33.5 18, 38.5 24, 37.5 31 C36.5 35.5, 34.5 38.5, 32 38.5 C29.5 38.5, 27.5 35.5, 26.5 31 C25.5 24, 30.5 18, 32 13 Z" fill="url(#flameCore)"/>

  <!-- Diya Lamp Bowl -->
  <path d="M7 38 C13 54, 51 54, 57 38 C56 42, 46 51, 32 51 C18 51, 8 42, 7 38 Z" fill="url(#brassBowl)"/>

  <!-- Diya Rim and Oil Pool -->
  <ellipse cx="32" cy="38" rx="25" ry="5.5" fill="url(#brassRim)"/>
  <ellipse cx="32" cy="38.5" rx="22" ry="4" fill="#664403"/>
  <ellipse cx="32" cy="39" rx="19" ry="3" fill="#3D2500"/>
  <!-- Golden oil reflection -->
  <ellipse cx="32" cy="39.2" rx="15" ry="1.8" fill="#F5C747" opacity="0.75"/>

  <!-- Pedestal / Lamp Stand -->
  <path d="M24 51 L40 51 L43 57.5 C43 57.5, 43.5 59.5, 41 59.5 L23 59.5 C20.5 59.5, 21 57.5, 21 57.5 Z" fill="url(#brassBase)"/>
  <ellipse cx="32" cy="59.5" rx="10" ry="1.5" fill="#382400"/>

  <!-- Auspicious Festive Sparkles -->
  <path d="M12 19 Q12 23 8 23 Q12 23 12 27 Q12 23 16 23 Q12 23 12 19 Z" fill="#FFE27B" opacity="0.9"/>
  <path d="M52 17 Q52 20.5 48.5 20.5 Q52 20.5 52 24 Q52 20.5 55.5 20.5 Q52 20.5 52 17 Z" fill="#FFE27B" opacity="0.9"/>
  <circle cx="21" cy="11" r="1.2" fill="#FFF9C4" opacity="0.85"/>
  <circle cx="44" cy="9" r="1.3" fill="#FFF9C4" opacity="0.85"/>
</svg>
